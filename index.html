`<!DOCTYPE html> <!--dit is de homepage van mijn site-->
<html> <!--dit is het html-element-->

<head>
    <title>Het eerste begin</title> <!--titel die in het browsertabblad komt te staan-->
    <meta charset="utf-8"> <!--zorgt dat speciale tekens goed getoond worden-->

    <style>
        .menu {
            position: absolute;
            top: 20px;
            right: 30px;
        }
    </style>
    <!--style: zorgt ervoor dat het menu rechtsboven op de pagina komt te staan-->
    <!--position: absolute: geeft het menu een vaste plek op de pagina-->
    <!--top: 20px: geeft ruimte vanaf de bovenkant-->
    <!--right: 30px: geeft ruimte vanaf de rechterkant-->
</head>

<body style="font-family: Arial, sans-serif; background-color: #1e1e1e; color: #f0f0f0; text-align: center; margin: 0; padding: 0;">
    <!--body: alles wat je hier zet, is zichtbaar op de pagina-->
    <!--font-family: het lettertype van de tekst-->
    <!--background-color: donkere achtergrondkleur voor de hele pagina-->
    <!--color: lichte tekstkleur-->
    <!--text-align: center: zet de tekst in het midden-->

    <div style="background-color: #4CAF50; padding: 30px;">
        <!--div: een blok/container voor de header-->
        <!--background-color: groene achtergrondkleur-->
        <!--padding: zorgt voor ruimte rondom de titel-->

        <h1>Mijn Website</h1> <!--h1: grote hoofdtitel bovenaan de pagina-->
    </div>

    <p style="margin-top: 30px; font-size: 18px;">
        Hier komt mijn eerste tekst
    </p>
    <!--p: een paragraaf tekst-->

    <h2 style="color: #4CAF50;">yo yo yo</h2>
    <!--h2: een subkop, hier groen gekleurd-->


    <div class="menu">
        <!--div: bevat het uitklapmenu rechtsboven-->

        <button onclick="toggleMenu()" style="background: none; border: none; color: white; font-size: 18px; cursor: pointer;">
            Onderwerpen ▼
        </button>
        <!--button: de knop waarmee je het menu opent en sluit-->
        <!--background: none: zorgt ervoor dat de knop geen achtergrond heeft-->
        <!--border: none: haalt de rand van de knop weg-->
        <!--color: white: maakt de tekst wit-->
        <!--cursor: pointer: zorgt dat de muis verandert in een handje-->


        <div id="menuInhoud" style="display: none; text-align: right; margin-top: 10px;">
            <!--div: bevat de onderwerpen die verschijnen na het klikken-->
            <!--display: none: het menu is eerst verborgen-->
            <!--text-align: right: de onderwerpen worden rechts uitgelijnd-->

            <a href="invoer.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Invoer
            </a>
            <!--a: link naar de pagina Invoer-->

            <a href="verwerking.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Verwerking
            </a>
            <!--a: link naar de pagina Verwerking-->

            <a href="uitvoer.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Uitvoer
            </a>
            <!--a: link naar de pagina Uitvoer-->

            <a href="binairstelsel.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Binair stelsel
            </a>
            <!--a: link naar de pagina Binair stelsel-->

            <a href="kleurmodellen.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Kleurmodellen
            </a>
            <!--a: link naar de pagina Kleurmodellen-->

            <a href="compressie.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                Compressie
            </a>
            <!--a: link naar de pagina Compressie-->

            <a href="ai.html" style="display: block; color: white; text-decoration: none; margin: 8px;">
                AI
            </a>
            <!--a: link naar de pagina AI-->

        </div>
        <!--einde van de lijst met onderwerpen-->

    </div>
    <!--einde van het menu rechtsboven-->


    <script>
        function toggleMenu() {
            var menu = document.getElementById("menuInhoud");

            if (menu.style.display === "none") {
                menu.style.display = "block";
            } else {
                menu.style.display = "none";
            }
        }
    </script>
    <!--script: zorgt ervoor dat het menu open en dicht kan gaan-->
    <!--getElementById: zoekt het menu op-->
    <!--if: controleert of het menu verborgen is-->
    <!--block: maakt het menu zichtbaar-->
    <!--else: verbergt het menu weer-->

</body> <!--einde van de zichtbare inhoud-->
</html> <!--einde van het HTML-document-->
